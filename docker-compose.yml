services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blockwatch
      POSTGRES_PASSWORD: blockwatch
      POSTGRES_DB: blockwatch
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blockwatch']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Published on 6380 so the project does not collide with a Redis already
    # running on the host's default 6379.
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
